[package]
name = "k617rgb"
version = "0.3.0"
license = "MIT"
edition = "2021"

[dependencies]
eframe = { version = "0.36", optional = true, default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "persistence"] }

[features]
gui = ["dep:eframe"]

[[bin]]
name = "k617rgb-gui"
required-features = ["gui"]

[profile.release]
strip = true
